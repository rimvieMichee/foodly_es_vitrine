<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>GESTRESTO</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="GESTRESTO est une plateforme de gestion de restaurant avec QR Code, commandes sur place, livraison et réservation." />
  <meta name="keywords" content="restaurant, gestion restaurant, qr code restaurant, commande restaurant, gestresto" />
  <meta name="theme-color" content="#3730a3" />
  <meta property="og:title" content="GESTRESTO - Gestion de restaurant et commandes QR Code" />
  <meta property="og:description" content="GESTRESTO est une plateforme de gestion de restaurant avec QR Code, commandes sur place, livraison et réservation." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gestresto.app" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <app-root></app-root>

  <!-- Formulaire statique requis pour la détection Netlify Forms au build -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="text" name="contact" />
    <input type="text" name="restaurant" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
